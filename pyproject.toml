[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cicd-support-rag"
version = "0.1.0"
description = "PipelineHub customer support RAG project"
requires-python = ">=3.11"
dependencies = ["langchain-core>=1,<2", "langgraph>=1,<2", "pydantic>=2.7,<3"]

[project.optional-dependencies]
retrieval = [
  "fastembed>=0.9,<0.10",
  "pinecone>=10,<11",
  "rank-bm25>=0.2.2,<0.3",
  "python-dotenv>=1,<2",
  "numpy>=1.26,<3",
  "tokenizers>=0.15,<1",
  "huggingface-hub>=0.20,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cicd_support_rag = ["web/*.html", "web/*.css", "web/*.js"]
